name: CI

# Phase 1（Issue #21 / T003）: 型チェック → ESLint → Vitest → シナリオ検証（T010）を
# PR と main への push で実行する。T017 で Playwright E2E ジョブを追加した。
# axe-core（T026）のジョブは完了後に追加する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN はリポジトリの読み取りだけに絞る（リポジトリ設定の既定も読み取り専用だが、ここで明示する）
permissions:
  contents: read

jobs:
  ci:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: シナリオ検証（scenarios/terms/legal の YAML → JSON ビルド, T010）
        run: npm run build:data

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # T017: S1 通しプレイの E2E。typecheck/lint/test/build:data と並行して実行してよい独立ジョブ。
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
