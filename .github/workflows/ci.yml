name: CI

# Phase 1（Issue #21 / T003）: 型チェック → ESLint → Vitest → シナリオ検証（T010）を
# PR と main への push で実行する。T017 で Playwright E2E ジョブを追加した。
# axe-core（T026）のジョブは完了後に追加する。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: シナリオ検証（scenarios/terms/legal の YAML → JSON ビルド, T010）
        run: npm run build:data

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    # T017: S1 通しプレイの E2E。typecheck/lint/test/build:data と並行して実行してよい独立ジョブ。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
