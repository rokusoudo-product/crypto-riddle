# 依存関係の自動更新（AI×Security Conference 2026 の持ち帰り）。
# 方針: 常に最新を保つ。ただし新しい版は公開から7日待ってから入れる（cooldown）。
# セキュリティ更新には cooldown はかからない（Dependabot の仕様）。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
