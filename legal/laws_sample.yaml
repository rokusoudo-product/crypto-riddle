# crypto-riddle 法制度データ(サンプル)
#
# 位置づけ:
# - シナリオ本体(scenarios/*.yaml)から分離した「更新可能なデータ」(plan.md §4)。
#   条文番号・報告期限は法改正で変わるため、シナリオのセリフやカード本文に直接書かず、
#   このファイルの id を legal_refs で参照する形に統一する(docs/characters.md §9)。
# - src/core/model/legal.ts (zod, T005) に準拠する。`npm run build:data` で検証できる。
# - 本ファイルは #3(スキーマ定義)のサンプルであり、内容の法的正確性は制作時(#14 出典表記規則確定後)に
#   代表監修のうえ再確認すること。LAW-APPI-BREACH-REPORT・LAW-APPI-CONSIGNMENT-SUPERVISION は
#   2026-09-12(#81)に条文番号を代表確認済み(last_verified もその日付)。LAW-UCA-UNAUTHORIZED-ACCESS
#   の last_verified はサンプル作成時点のプレースホルダのまま(未確認)。

schema_version: "0.1.0"

laws:
  # 2026-09-12(#81)是正: article は #76 制作時点で「第22条の2」(令和2年改正直後の条番号)と
  # していたが、令和3年改正(個人情報保護法・行政機関個人情報保護法等の統合)により条文が
  # 繰り上がり、制作時点(2026-09-12)の現行条番号は「第26条」。代表確認済み。
  - id: LAW-APPI-BREACH-REPORT
    law_name: 個人情報の保護に関する法律
    article: 第26条
    title: 漏えい等の報告等
    report_deadline: >-
      速報: 個人情報保護委員会が定める事態を知った後、速やかに(概ね3〜5日以内が目安)。
      確報: 知った日から30日以内(不正の目的をもって行われた漏えい等の場合は60日以内)。
    summary: >-
      個人データの漏えい等が発生し、個人の権利利益を害するおそれが大きい場合に、
      個人情報保護委員会への報告と本人への通知が義務付けられる規定。報告は速報・確報の二段階。
    last_verified: "2026-09-12"
    source_url: "https://elaws.e-gov.go.jp/document?lawid=415AC0000000057"

  # 2026-09-11(#76)追加時点では article を「第22条」(令和2年改正直後の条番号)としていたが、
  # 2026-09-12(#81)是正: 令和3年改正(個人情報保護法・行政機関個人情報保護法等の統合)により
  # 条文が繰り上がり、制作時点(2026-09-12)の現行条番号は「第25条」。上記
  # LAW-APPI-BREACH-REPORT(第26条)と合わせて代表確認済み。
  - id: LAW-APPI-CONSIGNMENT-SUPERVISION
    law_name: 個人情報の保護に関する法律
    article: 第25条
    title: 委託先の監督
    report_deadline: >-
      本条自体に報告期限の定めはない(監督義務は漏えい等の発生時に限らず、委託先選定時・契約時・
      委託後も継続的に果たすべき義務)。漏えい等が発生した場合の個人情報保護委員会への報告期限は
      別途 LAW-APPI-BREACH-REPORT を参照。
    summary: >-
      個人データの取扱いの全部または一部を委託する場合、委託元は委託先に対して必要かつ適切な
      監督を行わなければならないとする規定。委託先の安全管理措置の実施状況の確認・必要な指示等が
      含まれ、委託先の監督が不十分であったことに起因する漏えい等は、委託元の義務違反として
      問題になり得る。「業務を委託しているから委託元は無関係」とはならない点が要点。
    last_verified: "2026-09-12"
    source_url: "https://elaws.e-gov.go.jp/document?lawid=415AC0000000057"

  - id: LAW-UCA-UNAUTHORIZED-ACCESS
    law_name: 不正アクセス行為の禁止等に関する法律
    article: 第3条
    title: 不正アクセス行為の禁止
    report_deadline: >-
      法定の報告期限はないが、被害を認知した場合は速やかに警察・IPA等への届出が推奨される。
    summary: >-
      他人のID・パスワードを無断で用いてアクセス制御機能を回避し、
      制限されている特定利用をし得る状態にする行為等を禁止する規定。
    last_verified: "2026-08-07"
    source_url: "https://www.npa.go.jp/cyber/"
