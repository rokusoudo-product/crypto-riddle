# crypto-riddle 法制度データ(サンプル)
#
# 位置づけ:
# - シナリオ本体(scenarios/*.yaml)から分離した「更新可能なデータ」(plan.md §4)。
#   条文番号・報告期限は法改正で変わるため、シナリオのセリフやカード本文に直接書かず、
#   このファイルの id を legal_refs で参照する形に統一する(docs/characters.md §9)。
# - src/core/model/legal.ts (zod, T005) に準拠する。`npm run build:data` で検証できる。
# - 本ファイルは #3(スキーマ定義)のサンプルであり、内容の法的正確性は制作時(#14 出典表記規則確定後)に
#   代表監修のうえ再確認すること。last_verified はサンプル作成時点のプレースホルダ。

schema_version: "0.1.0"

laws:
  - id: LAW-APPI-BREACH-REPORT
    law_name: 個人情報の保護に関する法律
    article: 第22条の2
    title: 漏えい等の報告等
    report_deadline: >-
      速報: 個人情報保護委員会が定める事態を知った後、速やかに(概ね3〜5日以内が目安)。
      確報: 知った日から30日以内(不正の目的をもって行われた漏えい等の場合は60日以内)。
    summary: >-
      個人データの漏えい等が発生し、個人の権利利益を害するおそれが大きい場合に、
      個人情報保護委員会への報告と本人への通知が義務付けられる規定。報告は速報・確報の二段階。
    last_verified: "2026-08-07"
    source_url: "https://www.ppc.go.jp/"

  - id: LAW-UCA-UNAUTHORIZED-ACCESS
    law_name: 不正アクセス行為の禁止等に関する法律
    article: 第3条
    title: 不正アクセス行為の禁止
    report_deadline: >-
      法定の報告期限はないが、被害を認知した場合は速やかに警察・IPA等への届出が推奨される。
    summary: >-
      他人のID・パスワードを無断で用いてアクセス制御機能を回避し、
      制限されている特定利用をし得る状態にする行為等を禁止する規定。
    last_verified: "2026-08-07"
    source_url: "https://www.npa.go.jp/cyber/"
