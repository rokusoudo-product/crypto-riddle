# crypto-riddle S2「VPN装置の脆弱性放置とランサムウェア感染」(量産1本目)
#
# 位置づけ:
# - Issue #74(#6 バックログ S2〜S8 のうち優先1番)に基づく量産シナリオ第1弾。
# - schema_version 0.6.0(会話モード questions[] ＋探索 scenes=背景・collect の line/speaker・
#   goto/door/prompt)。実装様式は scenarios/s1-targeted-email-intrusion.yaml を手本にした。
# - 題材(#6): VPN装置の脆弱性放置→不正アクセス→認証情報窃取→Pass-the-Hashによる
#   ラテラルムーブメント→ランサムウェア感染→バックアップも被害、という脆弱性管理の不備が
#   組織全体に波及する構造。特定のCVE番号・特定のVPN製品・実在企業名は一切使わず、
#   実在事案を特定できない類型に抽象化したオリジナル創作(citation-policy §1・#6受け入れ基準)。
# - IPA過去問はテーマの参考にのみ留め、docs/citation-policy.md に従い references は
#   material_kind + note のみ(特定の年度・問題からの引用ではないため)とする。
# - 法制度(個人情報保護委員会への報告義務)は legal/laws_sample.yaml の
#   LAW-APPI-BREACH-REPORT(速報3〜5日/確報30日)を resolution.legal_refs で参照し、
#   条文番号・報告期限はセリフ・カード本文に直書きしない(docs/scenario_schema.md §4)。
# - **これは代表監修前のドラフト**(Issue #74)。教育内容・法制度の正確性、初動対応の是非・
#   身代金支払いの是非といった争点は、断定を避け resolution.questions の選択肢＋explanations
#   で扱い、最終確定は代表レビューを経る前提で作成した。status: draft。
# - 背景シーン(bg-s2-office / bg-s2-server)はまだ画像を生成していない(IMAGE_WORKFLOWの
#   承認ゲート未実施)。アセットIDのみを参照し、実画像が無い間は
#   src/ui/components/explore/scene-explorer.tsx の BACKGROUND_SRC 未登録時のプレースホルダ
#   表示(トークン色+シーン名)にフォールバックする(コード変更不要)。ホットスポットの
#   position はプレースホルダにつき仮の値で、実背景生成後に目視して調整すること(S1の
#   position 決定コメント=当ファイル末尾のコミット履歴参照)。
#
# 注記: S1 と同じ理由(scripts/build-data.test.ts の S2 フィクスチャ一致テストが折り返しの
# 空白挿入を検出する)で、本文フィールド(body/description/line 等)は1行で記述している。

schema_version: "0.6.0"
id: s2-vpn-ransomware
title: VPN装置の脆弱性放置とランサムウェア感染
status: draft
map_order: 2

subject_tags:
  - 攻撃手法
  - 認証
  - インシデント対応
  - 法制度
  - ネットワーク基盤

difficulty: 2
estimated_minutes: 15

# 出典表記(docs/citation-policy.md §5, #14)。特定の年度・問題からの引用ではなく
# テーマ知識のみを参考にしたオリジナル創作のため、material_kind + note のみとする。
references:
  - material_kind: 攻撃手口
    note: 境界に設置されたVPN装置の既知の脆弱性を放置したことによる不正アクセスから、窃取した認証情報を使ったPass-the-Hashによるラテラルムーブメントを経てランサムウェアに感染するという攻撃の流れというテーマ知識を参考にしたオリジナル創作。特定の年度・問題・特定の脆弱性(CVE)・特定の製品からの引用ではない。
  - material_kind: 技術要素
    note: 資産管理台帳の不備によるパッチ適用漏れ、およびバックアップの3-2-1運用(複数世代・オフサイト・オフラインでの保管)というテーマ知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。

related_terms:
  - term-vpn
  - term-ransomware
  - term-privilege-escalation
  - term-incident-response-process
  - term-digital-forensics
  - term-log-analysis
  - term-bcp
  - term-appi-breach-report

intro:
  background: ある朝、精密機械部品メーカーの生産管理システムが一斉に使用不能になった。共有フォルダのファイルには見慣れない拡張子が付き、画面には身代金を要求するメッセージが表示されている。数か月前から更新の通知が滞っていた境界のVPN装置が、実は侵入の入口だったことが、対策室の到着後まもなく明らかになる。
  victim_company:
    name: 株式会社みなと精工
    industry: 精密機械部品製造業
    description: 自動車部品向けの精密加工部品を製造する中堅メーカー。取引先や在宅勤務者からの遠隔接続に境界のVPN装置を使っており、情報システム部門は少人数で運用を委託先に頼る部分も多く、機器の資産管理台帳の整備が後回しになっていた。
  character_intros:
    - character: 霧島
      line: 複数のサーバへ立て続けにログインした形跡がある。ラテラルムーブメントだ。まず侵入経路と被害範囲を洗おう。
    - character: 橘
      line: バックアップも巻き込まれているようですね。身代金の話が出る前に、事実確認と報告要否の判断を急ぎましょう。

investigation_points:
  - id: ip-vpn-log
    category: ログを見る
    label: VPN装置のアクセスログ
    description: 境界に設置されたVPN装置への外部からの接続記録を確認する。
  - id: ip-auth-log
    category: ログを見る
    label: 認証サーバのログ
    description: 社内サーバ群への認証・ログイン記録を確認する。
  - id: ip-fileserver-log
    category: ログを見る
    label: ファイルサーバの暗号化状況
    description: 共有フォルダの暗号化被害の記録を確認する。
  - id: ip-backup-log
    category: ログを見る
    label: バックアップサーバの状態
    description: バックアップサーバの接続状態と被害の記録を確認する。
  - id: ip-witness-itstaff
    category: 人に聞く
    label: 情シス担当への聞き取り
    description: VPN装置の資産管理・更新運用の実態を本人に確認する。
  - id: ip-witness-manager
    category: 人に聞く
    label: 管理部門長への聞き取り
    description: 業務への影響と今後の対応方針についての考えを聞く。
  - id: ip-witness-vendor
    category: 人に聞く
    label: VPN保守業者への聞き取り
    description: VPN装置の設置・更新案内の経緯を委託先に確認する。
  - id: ip-reference-advisory
    category: 文献を引く
    label: 脆弱性対応・資産管理に関する注意喚起の確認
    description: 境界機器の脆弱性放置に関する注意喚起を確認する。
  - id: ip-reference-guideline
    category: 文献を引く
    label: バックアップ運用ガイドラインの確認
    description: バックアップの世代管理・保管方法に関する基本原則を確認する。

# 探索の背景シーン(docs/scenario_schema.md §2.5)。investigation_points(カードの出所の正)は
# 上記のまま維持し、ここは表示層(省略可)。S1 と同様、執務室・サーバ室の2シーンに分け、各
# investigation_point をちょうど1つの collect action から参照する(superRefine の整合性要件)。
# PC(情シス管理端末)に danger アクション(感染サーバの再起動)を1つ設け、カード群
# (card-witness-itstaff・card-countermeasure-isolate)にある「まず論理的に隔離し、電源操作の
# 前に証拠を保全する」という学びと整合させる(feedbackのみ・ペナルティ無し・操作継続可=
# 詰み防止, spec §8.4)。物理的に同じ場所にいる保守業者とVPN装置は、S1のサーバ管理者と同様に
# 1ホットスポット(person)に統合した。
scenes:
  - id: scene-office
    title: 執務室
    background: bg-s2-office
    hotspots:
      - object_type: pc
        position: [0.4, 0.65]
        label: 情シス管理端末
        actions:
          - kind: collect
            investigation_point_id: ip-auth-log
            label: 認証サーバのログを確認する
            line: 深夜、経理システムの管理者アカウントを使って、数分の間に複数のサーバへ次々とログインした記録がある。パスワードそのものではなく認証情報のハッシュ値を使い回す、Pass-the-Hashによるラテラルムーブメントの典型的な挙動だ。
            speaker: 霧島
          - kind: collect
            investigation_point_id: ip-fileserver-log
            label: ファイルサーバの暗号化状況を確認する
            line: ファイルサーバの共有フォルダを見た。数千件のファイルが短時間で見慣れない拡張子に置き換わっている。フォルダ直下には身代金を要求するメッセージファイルも置かれていた。ランサムウェアによる一括暗号化だ。
            speaker: 霧島
          - kind: danger
            label: 暗号化されたファイルサーバを再起動する
            feedback: "橘「ここでサーバを再起動すると、感染直後のプロセスや接続先の情報が乗ったメモリ上の証拠が消えてしまいます。まずネットワークから論理的に切り離し、フォレンジック調査の前に電源操作はしないでください。」"
          - kind: noop
            label: 今は触らない
      - object_type: person
        position: [0.2, 0.4]
        label: 情シス担当
        actions:
          - kind: collect
            investigation_point_id: ip-witness-itstaff
            label: 情シス担当に話を聞く
            line: 情シス担当に聞きました。VPN装置は数年前に保守業者へ設置してもらったきりで、資産管理台帳には登録されておらず、ファームウェア更新の通知が来ていたことにも気づいていなかったそうです。
            speaker: 橘
      - object_type: person
        position: [0.78, 0.55]
        label: 管理部門長
        actions:
          - kind: collect
            investigation_point_id: ip-witness-manager
            label: 管理部門長に話を聞く
            line: 管理部門長に伺いました。すでに一部の生産ラインの稼働に影響が出ており、一刻も早い復旧のためなら身代金の支払いも検討すべきではないか、との声が社内で出ているそうです。
            speaker: 橘
      - object_type: book
        position: [0.6, 0.16]
        label: 資料棚
        actions:
          - kind: collect
            investigation_point_id: ip-reference-advisory
            label: 脆弱性対応・資産管理に関する注意喚起を確認する
            line: 注意喚起を確認した。境界に設置されたVPN装置等の深刻な脆弱性が放置されると、そこを起点に社内ネットワークへ侵入され、認証情報の窃取や他端末への横展開に悪用される事例が全国的に報告されている。資産管理台帳で機器を把握し、深刻度の高い脆弱性から優先して更新するのが基本とされている。
            speaker: 霧島
          - kind: collect
            investigation_point_id: ip-reference-guideline
            label: バックアップ運用ガイドラインを確認する
            line: バックアップ運用ガイドラインを確認しました。バックアップは複数世代を保持し、本番環境とは別の媒体・別の場所に、ネットワークから切り離した状態でも保管すること(3-2-1ルール)。常時オンライン接続のバックアップは、侵入時に本体ごと暗号化される危険があるためです。
            speaker: 橘
      - object_type: door
        position: [0.95, 0.5]
        label: サーバ室への扉
        actions:
          - kind: goto
            scene_id: scene-server
            label: サーバ室へ移動する
  - id: scene-server
    title: サーバ室
    background: bg-s2-server
    hotspots:
      - object_type: person
        position: [0.51, 0.43]
        label: 保守業者
        prompt: "保守業者「点検に伺いました。何かありましたか？」"
        actions:
          - kind: collect
            investigation_point_id: ip-vpn-log
            label: VPN装置のログを確認する
            line: VPN装置のログを確認した。深夜、海外のIPアドレスから、有効な社員アカウントを使った接続が記録されている。フィッシングの形跡はなく、パッチが未適用のまま放置されていた脆弱性を突かれて認証を突破された可能性が高い。
            speaker: 霧島
          - kind: collect
            investigation_point_id: ip-witness-vendor
            label: 保守業者に話を聞く
            line: 保守業者に聞きました。半年ほど前、VPN装置のファームウェアに重大な脆弱性が見つかったとして更新を案内するメールを送ったが、その後の返信も更新作業の依頼もなく、そのままになっていたそうです。
            speaker: 橘
          - kind: noop
            label: 何でもない
      - object_type: device
        position: [0.18, 0.45]
        label: バックアップサーバ
        actions:
          - kind: collect
            investigation_point_id: ip-backup-log
            label: バックアップサーバの状態を確認する
            line: バックアップサーバを確認した。本番ネットワークに常時オンラインで接続されており、同じ管理者アカウントでアクセスできる状態だった。直近の世代のバックアップも、横展開の過程で他のファイルと同様に暗号化されており、そのままでは復旧に使えない。
            speaker: 霧島
      - object_type: door
        position: [0.5, 0.9]
        label: 執務室への扉
        actions:
          - kind: goto
            scene_id: scene-office
            label: 執務室へ移動する

