resolution:
  # #6の題材はCVE/CVSS・資産管理・ラテラルムーブメント・Pass-the-Hash・バックアップ3-2-1・
  # 身代金支払いの是非が中心で暗号解読を含まないため、S1と同様に0件とする(初動対応・方針判断
  # 中心。difficulty=2はcipherではなく問い数の増加(2→3)による)。
  cipher_stages: []

  # 会話モード(#42/T030)の問い列。#74指定の「起点→初動→方針」の3問構成。誤答肢の reply は
  # いずれも探索で集めたカードの内容を具体的に裏付けとして引用し、プレイヤーがカードドロワーで
  # 検証できる形にしている(S1の誤答肢執筆方針を踏襲)。
  questions:
    - id: q-entry-point
      subject_tag: 攻撃手法
      speaker: 霧島
      prompt: 今回の侵入、どこから入られたと見る？
      choices:
        - text: 境界に設置されたVPN装置の、更新されていなかった深刻な脆弱性を突かれた不正アクセス
          is_correct: true
          reply: その通りだ。VPN装置のログに残る不審な接続、保守業者への更新案内が放置されていた証言、資産管理台帳に機器そのものが載っていなかった実態がすべて一直線に噛み合っている。
        - text: 経理部宛の標的型メールによるマルウェア感染
          is_correct: false
          reply: その場合はメールサーバのログに不審な着信が残るはずだ。だが確認できたのはVPN装置への外部からの接続記録だけで、メール経由の侵入を示す痕跡はない。
        - text: 内部の従業員による不正な持ち出し
          is_correct: false
          reply: 内部犯行なら社内端末からの操作記録が残るはずだが、認証ログはすべて外部の海外IPアドレスからのVPN接続に基づいている。内部からの操作を示す証跡はない。
      explanations:
        - 「怪しく見える」ことと「今回の侵入経路を裏付ける証拠であること」は違う。境界の機器・認証ログ・関係者の証言が、時系列でどう繋がるかを確かめよう。
        - 侵入の起点は、境界に接する機器から探すのが定石だ。VPN装置のアクセスログと、その機器の管理状況についての証言、両方が同じ結論を指しているかをカードで確かめよう。
      consult_hint: VPN装置への不審な接続記録・保守業者からの更新案内が放置されていた証言・資産管理台帳の不備を分野で整理して提示する。

    - id: q-initial-response
      subject_tag: インシデント対応
      speaker: 橘
      prompt: ランサムウェアによる暗号化が確認された状況で、感染したサーバへの初動対応は？
      choices:
        - text: サーバをネットワークから論理的に切り離し、電源は落とさずメモリ・ディスクの証拠を保全した上で被害範囲を特定する
          is_correct: true
          reply: それが正しい初動です。ラテラルムーブメントの痕跡を辿って、被害範囲の特定を進めましょう。
        - text: 直ちにサーバを再起動して復旧を試みる
          is_correct: false
          reply: 再起動すれば、感染直後のプロセスや接続先の情報が乗ったメモリ上の証拠が失われます。原因の特定も被害範囲の確認もできなくなり、マルウェアが再び動き出すおそれもあります。まずネットワークからの切り離しを優先してください。
      explanations:
        - 電源を落とす・再起動するといった操作で真っ先に失われるものは何か、考えてみましょう。
        - 証拠保全の原則は「揮発性の高い情報から」です。まずネットワークから論理的に切り離し、そのうえでメモリ→ディスクの順に保全する—この手順そのものが、後の被害範囲特定と報告の裏付けになります。
      consult_hint: 揮発性の高い証拠から保全する原則と、再起動によって失われる情報を整理して提示する。

    - id: q-response-policy
      subject_tag: 法制度
      speaker: 橘
      prompt: バックアップも暗号化され、復旧の目処が立たない状況です。今後の対応方針は？
      choices:
        - text: 身代金は支払わず、警察・専門家と連携しながら復旧を進め、個人データの漏えいのおそれがある以上、個人情報保護委員会への報告要否を速やかに判断する
          is_correct: true
          reply: その判断が妥当です。支払いに応じても復号される保証はありませんし、報告義務の判断を後回しにはできません。
        - text: 早期の業務再開を優先し、要求どおり身代金を支払って復号キーを入手する
          is_correct: false
          reply: 支払っても復号される保証はなく、支払いが攻撃者への資金供与となって再び標的にされるおそれもあります。個人データの漏えいのおそれがある以上、報告義務の判断も別途必要です。
        - text: 業務への影響を避けるため、社内対応のみで済ませ外部への報告は行わない
          is_correct: false
          reply: 個人データの漏えいのおそれが大きい場合、個人情報保護委員会への報告(速報・確報の二段階)は法律上の義務です。報告を怠れば、インシデント対応とは別の法的リスクを負うことになります。
      explanations:
        - 「早く元に戻したい」という気持ちと、「取るべき手続き」は別に考えよう。支払いのリスクと、法律上の義務、それぞれを分けて整理してみよう。
        - 身代金の支払いは犯罪組織への資金供与になりかねず、復号の保証もありません。加えて、個人データの漏えいのおそれがある場合の報告義務(速報・確報)は、業務都合とは無関係に生じる法律上の義務です。
      consult_hint: 身代金支払いのリスク(復号の保証がない・資金供与になる)と、個人情報保護委員会への報告義務(速報・確報)を整理して提示する。

  clear_explanation:
    - character: 霧島
      line: 侵入口は、更新が放置されていたVPN装置の脆弱性だ。窃取した認証情報でPass-the-Hashによる横展開を許し、ファイルサーバとバックアップサーバの双方がランサムウェアに暗号化された。感染機器はまず論理的に隔離し、電源を落とさず証拠を保全する—これが鉄則だ。
    - character: 橘
      line: 資産管理台帳が整備されていれば、更新の放置にはもっと早く気づけたはずです。バックアップも、常時オンラインで繋ぎっぱなしにせず、複数世代・オフラインでの保管(3-2-1ルール)を徹底しておくべきでした。身代金は支払わず、個人情報保護委員会への報告要否の判断も忘れないでください。

  legal_refs:
    - LAW-APPI-BREACH-REPORT
