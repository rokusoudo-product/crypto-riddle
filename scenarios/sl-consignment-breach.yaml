# crypto-riddle SL「委託先クラウドストレージからの個人データ漏えい」(法務新規シナリオ・量産4本目)
#
# 位置づけ:
# - Issue #76(#6・法務が主役の1本。S2〜S8の候補外の新設)に基づく量産シナリオ第4弾。
#   企画は #76 のコメントで代表承認済み(2026-09-11)。様式は s1-targeted-email-intrusion.yaml・
#   s2-vpn-ransomware.yaml・s3-ec-card-leak.yaml を手本にした。
# - id は S1〜S3 の「s+数字」通し番号ではなく、S2〜S8 の量産候補外という位置づけ(#6・#76 本文)を
#   示すため意図的に "sl"(エス・エル。s+数字と衝突しない別命名)にした(代表承認コメントの表記通り)。
# - schema_version 0.6.0(会話モード questions[] ＋探索 scenes=背景・collect の line/speaker・
#   goto/door/prompt)。
# - 題材(#76・代表承認コメント 2026-09-11): サービス事業者が顧客の個人データ処理を外部委託先
#   (クラウド事業者)に委託していたところ、委託先が管理するクラウドストレージの共有設定ミスにより、
#   外部から個人データにアクセス可能な状態になっていたことが判明する、という構造。自社(蒼海
#   システムズの顧客企業)は個人情報保護法上の委託元にあたる。謎解きの核は「事故が起きたのは
#   委託先の管理領域なのに、なぜ委託元である自社に報告義務や監督義務が生じるのか」を追わせ、
#   「業務を委託しているのだから、そこで起きた事故は委託先の責任であり自社は無関係だ」という
#   誤解(#76 学習狙い)を正す点にある。特定の実在企業・実在事案・実在の委託先事業者は一切使わず、
#   実在事案を特定できない類型に抽象化したオリジナル創作(citation-policy §1)。
# - IPA過去問はテーマの参考にのみ留め、docs/citation-policy.md に従い references は
#   material_kind + note のみ(特定の年度・問題からの引用ではないため)とする。
# - 法制度(個人情報保護法)は legal/laws_sample.yaml の LAW-APPI-CONSIGNMENT-SUPERVISION(新設・
#   委託先の監督)と LAW-APPI-BREACH-REPORT(既存・漏えい等の報告等)を resolution.legal_refs で
#   参照し、条文番号・報告期限はセリフ・カード本文に直書きしない(docs/scenario_schema.md §4)。
#   LAW-APPI-CONSIGNMENT-SUPERVISION の条文番号は制作時点(2026-09-11)は「第22条」のドラフト値
#   だったが、2026-09-12(#81)に代表確認のうえ現行条番号「第25条」へ是正した(legal/laws_sample.yaml
#   側で修正・last_verified 更新済み。本ファイルは legal_refs で id 参照のみのため変更なし)。
# - **これは代表監修前のドラフト**(Issue #76)。教育内容・法制度(委託先監督義務・報告義務)の
#   正確性は断定を避け resolution.questions の選択肢＋explanations で扱い、最終確定は代表レビュー
#   (#81)を経る前提で作成した。status: draft。
# - 背景シーン(bg-sl-office / bg-sl-vendor)は代表承認済みの採用画像を
#   assets/backgrounds/bg-sl-office.png・bg-sl-vendor.png として確定した(#76 仕上げ・
#   DESIGN.md P-9/P-10)。採用した bg-sl-office(執務室)はドアの無い構図のため、
#   scene-office 側にあった委託先ブースへ移動する door ホットスポット(goto)は削除した。
#   scene-vendor 側の「執務室への扉」door(scene-office への goto)はそのまま残しており、
#   執務室→委託先はシーンタブ、委託先→執務室はドア＋シーンタブの両方で移動できる。
#   各ホットスポットの position は採用背景を目視して調整済み(S1/S2/S3の position 決定
#   コメント参照)。
#
# 注記: S1/S2/S3 と同じ理由(scripts/build-data.test.ts のフィクスチャ一致テストが折り返しの
# 空白挿入を検出する)で、本文フィールド(body/description/line 等)は1行で記述している。

schema_version: "0.7.0"
id: sl-consignment-breach
title: 委託先クラウドストレージからの個人データ漏えい
status: draft
map_order: 4

subject_tags:
  - 攻撃手法
  - インシデント対応
  - 法制度

difficulty: 3
estimated_minutes: 12

# 出典表記(docs/citation-policy.md §5, #14)。特定の年度・問題からの引用ではなく
# テーマ知識のみを参考にしたオリジナル創作のため、material_kind + note のみとする。
references:
  - material_kind: 事例類型
    note: 個人データの取扱いを委託した外部のクラウド事業者側で、保管領域の共有設定ミスにより個人データが外部から閲覧可能な状態になった、という事例類型をテーマとして参考にしたオリジナル創作。特定の年度・問題・特定の被害事例からの引用ではない。
  - material_kind: 用語
    note: 個人情報保護法における委託先の監督義務・漏えい等の報告義務という法制度知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。

related_terms:
  - term-appi-breach-report
  - term-incident-response-process
  - term-log-analysis

intro:
  background: ある朝、宅配会員サービスを営む「株式会社ひばり生活サービス」に、会員データの管理システム運用を委託しているクラウド事業者から一本の連絡が入った。「保管しているデータの一部に、外部からアクセスされた可能性がある」。詳しく確認すると、会員の氏名・住所等を含むデータが保存されたクラウドストレージの共有設定が、委託先の作業ミスによって外部から閲覧できる状態になっていたことが判明した。「委託しているのだから自社は無関係」で済む話なのか——対策室に招集がかかる。
  victim_company:
    name: 株式会社ひばり生活サービス
    industry: 生活関連サービス業(会員制宅配サービス)
    description: 会員向けの食品・日用品の定期宅配サービスを運営する企業。会員の氏名・住所・購入履歴等の個人データを扱う会員管理システムの運用を、外部のクラウド事業者(委託先)に委託している。
  character_intros:
    - character: 霧島
      line: 委託先の設定ミスだとしても、原因の裏取りは必要だ。まずログを確認しよう。
    - character: 橘
      line: 委託先の話だから終わり、ではありません。監督義務と報告義務、両方の判断が必要です。

investigation_points:
  - id: ip-contract-supervision
    category: 文献を引く
    label: 委託契約書(監督条項)の確認
    description: 委託先との契約書に、委託先の監督に関する条項が定められているかを確認する。
  - id: ip-appi-guideline
    category: 文献を引く
    label: 個人情報保護法ガイドライン(委託先の監督義務)の確認
    description: 個人データの取扱いを委託した場合の委託元の監督義務について、ガイドラインで確認する。
  - id: ip-vendor-initial-report
    category: ログを見る
    label: 委託先からの一次報告の確認
    description: 委託先から届いた事故の一次報告の内容を確認する。
  - id: ip-vendor-storage-log
    category: ログを見る
    label: 委託先クラウドストレージのアクセスログ
    description: 委託先が管理するクラウドストレージへの外部からのアクセス記録を確認する。
  - id: ip-vendor-testimony
    category: 人に聞く
    label: 委託先担当者への聞き取り
    description: 委託先の担当者に、設定変更の経緯と管理体制を確認する。
  - id: ip-vendor-safety-measures
    category: 文献を引く
    label: 委託先の安全管理措置報告の確認
    description: 委託先が提出した安全管理措置の報告書の内容を確認する。

# 探索の背景シーン(docs/scenario_schema.md §2.5)。investigation_points(カードの出所の正)は
# 上記のまま維持し、ここは表示層(省略可)。自社執務室(scene-office)・委託先ブース/会議室
# (scene-vendor)の2シーンに分け、各 investigation_point をちょうど1つの collect action から
# 参照する(superRefine の整合性要件)。#76 代表承認コメントの構成(①執務室=委託契約書棚・
# PC(委託先の一次報告)②委託先ブース=委託先担当者・委託先の安全管理措置の資料)に沿い、
# 自社側の文献(契約書・ガイドライン)は執務室の書棚に、委託先側の技術ログ・証言・報告書は
# 委託先ブースに置いた。PC(委託先の一次報告端末)には danger アクション(事実確認前の未確認
# 情報の転送)を1つ設け、法務領域の教育的フィードバックのみを返す(ペナルティ無し・操作継続可
# =詰み防止, spec §8.4)。霧島・橘は本シナリオでも(S1〜S3と同様)ホットスポットではなく、
# 導入・collectの話者・解決の会話モードの出題者として登場する。
scenes:
  - id: scene-office
    title: 自社執務室
    background: bg-sl-office
    hotspots:
      - object_type: book
        position: [0.17, 0.32]
        label: 委託契約書棚
        actions:
          - kind: collect
            investigation_point_id: ip-contract-supervision
            label: 委託契約書(監督条項)を確認する
            line: 委託契約書を確認しました。委託先に対し、安全管理措置の実施状況を定期的に報告させ、必要な指示を行うことができる監督条項が明記されています。
            speaker: 橘
          - kind: collect
            investigation_point_id: ip-appi-guideline
            label: 個人情報保護法ガイドラインを確認する
            line: ガイドラインを確認しました。個人データの取扱いを委託する場合、委託元は委託先に対して必要かつ適切な監督を行う義務を負い、委託先の監督が不十分であったことに起因する漏えい等は、委託元の義務違反として問題になり得るとされています。
            speaker: 橘
      - object_type: pc
        position: [0.56, 0.45]
        label: 委託先の一次報告を受けた端末
        actions:
          - kind: collect
            investigation_point_id: ip-vendor-initial-report
            label: 委託先からの一次報告を確認する
            line: 委託先からの一次報告メールを確認した。クラウドストレージの共有設定を「限定公開」から誤って「リンクを知っていれば誰でも閲覧可能」に変更しており、外部からアクセスされた形跡があるとのことだった。
            speaker: 霧島
          - kind: danger
            label: 委託先からの一次報告メールを、事実関係の確認や公表判断を待たずにそのまま社内外へ転送する
            feedback: "橘「事実関係が固まる前に未確認の情報を広めると、後で内容が変わった場合に混乱と説明責任の問題を招きます。まずは委託先に詳細を確認し、社内の情報管理体制に沿って共有してください。」"
          - kind: noop
            label: 今は触らない
  - id: scene-vendor
    title: 委託先ブース(会議室)
    background: bg-sl-vendor
    hotspots:
      - object_type: device
        position: [0.19, 0.68]
        label: 委託先のクラウドストレージ管理端末
        actions:
          - kind: collect
            investigation_point_id: ip-vendor-storage-log
            label: クラウドストレージのアクセスログを確認する
            line: 委託先のクラウドストレージのアクセスログを確認した。共有設定が変更された直後から、複数の見知らぬ外部IPアドレスから会員データの保管領域へ直接アクセスされた記録が残っている。
            speaker: 霧島
      - object_type: person
        position: [0.44, 0.55]
        label: 委託先担当者
        prompt: "委託先担当者「何かご質問はありますか？」"
        actions:
          - kind: collect
            investigation_point_id: ip-vendor-testimony
            label: 委託先担当者に話を聞く
            line: 委託先担当者に聞きました。クラウドストレージの公開範囲の設定を、定期点検の作業中に誤って変更してしまったとのことでした。契約で定められていた定期点検も、人員不足で直近は実施できていなかったそうです。
            speaker: 橘
          - kind: noop
            label: 何でもない
      - object_type: book
        position: [0.84, 0.62]
        label: 委託先の安全管理措置報告書
        actions:
          - kind: collect
            investigation_point_id: ip-vendor-safety-measures
            label: 安全管理措置の報告書を確認する
            line: 委託先が提出した安全管理措置の報告書を確認した。アクセス権限の設定手順は定められているが、変更後の設定内容を第三者が確認するダブルチェック体制までは整備されていなかった。
            speaker: 橘
      - object_type: door
        position: [0.6, 0.5]
        label: 執務室への扉
        actions:
          - kind: goto
            scene_id: scene-office
            label: 執務室へ移動する

