resolution:
  # #76の題材は個人情報保護法(委託先監督義務・漏えい報告義務)が中心で暗号解読を含まないため、
  # S1〜S3と同様に0件とする(法制度・組織論寄りの初動対応・方針判断中心)。
  cipher_stages: []

  # 会話モード(#42/T030)の問い列。#76代表承認コメントの「原因→報告義務の所在→是正・方針」の
  # 3問構成。誤答肢の reply はいずれも探索で集めたカードの内容を具体的に裏付けとして引用し、
  # プレイヤーがカードドロワーで検証できる形にしている(S1〜S3の誤答肢執筆方針を踏襲)。
  questions:
    - id: q-cause
      subject_tag: 攻撃手法
      speaker: 霧島
      prompt: 顧客の個人データが漏えいした原因は、どこにあると見る？
      choices:
        - text: 委託先のクラウドストレージの共有設定が誤って「限定公開」から「リンクを知っていれば誰でも閲覧可能」に変更されており、外部からアクセスされた
          is_correct: true
          reply: その通りだ。アクセスログの記録と委託先担当者自身の証言、どちらも共有設定の誤変更という一点で一致している。
        - text: 自社のシステムが直接サイバー攻撃を受け、外部から侵入された
          is_correct: false
          reply: 自社側のシステムにそのような侵害の痕跡はない。今回問題が起きているのは、委託先が管理するクラウドストレージの側だ。
        - text: 委託先の従業員が個人データを意図的に持ち出した
          is_correct: false
          reply: 意図的な持ち出しなら、アクセス権限の不正な操作やデータの外部送信といった別の痕跡が残るはずだが、そうした証拠はない。見つかっているのは、共有設定の誤変更という単純なミスだ。
      explanations:
        - まず「誰が・何を・どう変えたか」を裏付ける記録があるかどうかで、原因の候補を絞り込もう。
        - 委託先担当者の証言とアクセスログが指し示す先が一致しているかを確認しよう。悪意ある行為なら別の痕跡が残るはずだ。
      consult_hint: 委託先クラウドストレージのアクセスログ・委託先担当者の証言・委託先の安全管理措置報告の内容を分野で整理して提示する。

    - id: q-report-duty
      subject_tag: 法制度
      speaker: 橘
      prompt: 個人データの漏えいのおそれが確認できました。報告義務は誰に生じると考えますか？
      choices:
        - text: 個人データを取り扱う委託元である自社にも個人情報保護委員会への報告義務があり、委託先と連携して対応する必要がある
          is_correct: true
          reply: その理解が正しいです。委託しているからといって、自社が報告義務から外れるわけではありません。
        - text: 事故が起きたのは委託先の管理領域なので、委託先が単独で個人情報保護委員会に報告すればよく、自社に義務はない
          is_correct: false
          reply: 個人データの取扱いを委託した場合でも、委託元は自社が取り扱う個人データについて報告義務を負います。委託先の問題だからと自社が無関係になるわけではありません。
        - text: 契約書に委託先が全責任を負う旨の特約があるため、自社としては特に対応する必要はない
          is_correct: false
          reply: 契約上の責任分担と、個人情報保護法上の報告義務は別の話です。特約があっても、委託元としての報告義務の判断そのものを免れることはできません。
      explanations:
        - 「事故が起きた場所」と「報告義務を負う主体」は必ずしも一致するとは限らない。委託元・委託先それぞれの役割を整理しよう。
        - 個人情報保護法は、個人データを取り扱う事業者(委託元)に対しても監督義務・報告義務を課している。委託先の管理下で起きた事故であっても、委託元として報告要否を判断する責任は残る。
      consult_hint: 個人情報保護法ガイドラインが定める委託元の監督義務・報告義務の考え方と、契約上の責任分担は別問題であることを整理して提示する。

    - id: q-corrective-action
      subject_tag: 法制度
      speaker: 橘
      prompt: 再発防止に向けて、今後どのような方針を取るべきですか？
      choices:
        - text: 委託契約の内容を見直し、委託先の安全管理措置の実施状況を定期的に確認する体制を整え、再委託の状況も把握できるようにする
          is_correct: true
          reply: それが妥当な方針です。監督義務を継続的に果たせる体制に見直しましょう。
        - text: 委託先を別の事業者に変更するだけで、自社側の監督体制は特に見直さない
          is_correct: false
          reply: 委託先を変えても、自社が委託先を適切に監督する体制がなければ、同じ問題が再び起こり得ます。委託先の選定だけでなく、自社の監督のしくみ自体を見直す必要があります。
        - text: 原因は委託先の設定ミスにあるため、自社の運用は特に変更せず、委託先の対応を見守る
          is_correct: false
          reply: 監督義務は一度きりの確認では終わりません。委託先の対応を見守るだけでなく、自社としても定期的に確認するしくみを持つことが求められます。
      explanations:
        - 「原因が委託先にある」ことと「自社が何もしなくてよい」ことは同じではない。委託元として継続的に果たすべき役割を考えよう。
        - 委託契約の監督条項の見直し、安全管理措置の定期確認、再委託先の把握—これらはいずれも委託元として果たすべき委託先監督義務の一部だ。
      consult_hint: 委託契約書の監督条項・委託先の安全管理措置報告・委託先監督義務の是正内容(契約見直し・定期確認・再委託管理)を整理して提示する。

  clear_explanation:
    - character: 霧島
      line: 原因は、委託先のクラウドストレージの共有設定が、定期点検の作業中に誤って「誰でも閲覧可能」に変更されていたことだ。外部からのアクセスログと委託先担当者の証言、どちらも設定ミスという一点で一致している。
    - character: 橘
      line: 個人データの取扱いを委託していても、委託元である自社の報告義務や監督義務がなくなるわけではありません。委託契約の監督条項を見直し、安全管理措置の定期確認と再委託先の把握を続けることが、今後の再発防止につながります。

  legal_refs:
    - LAW-APPI-CONSIGNMENT-SUPERVISION
    - LAW-APPI-BREACH-REPORT
