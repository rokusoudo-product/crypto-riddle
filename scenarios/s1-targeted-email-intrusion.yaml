# crypto-riddle S1「標的型メールからの侵入」(入門編)
#
# 位置づけ:
# - Issue #5 の受け入れ基準に基づく本番シナリオ第1弾(tasks.md T015)。
#   ゲートPプロトタイプ(「アルファテック社」)は流用せず、被害企業・関係者はすべて本シナリオ用に新規に起こした。
# - 入門編のため暗号(cipher_stages)を含めない(#5 代表回答: 初動対応中心)。
#   resolution.cipher_stages は空配列(src/core/model/scenario.ts の T015 変更で0件を許容)。
# - 実在の企業・人物・事案を特定できない類型に抽象化し、攻撃手法は学習目的に必要な粒度に留め、
#   再現手順書にはしていない(#5 受け入れ基準)。
# - src/core/model/scenario.ts (zod, schema_version 0.6.0) に準拠する。`npm run build:data` で検証できる。
# - 解決パート(resolution)は会話モード(#42/T030)の questions[] 形式(#44 で旧 attack_identification/
#   countermeasure/wrong_answer_follow_ups から機械移植。#46/T035 で誤答肢のセリフを本執筆し、
#   各誤答理由が具体的なカード(EDR検知の時系列・プロキシログの向き等)を裏付けに引用する形へ仕上げた)。
#
# 注記: 本文フィールド(body/description/line 等)は意図的に1行で記述している。YAML の折り畳み
# ブロックスカラー(`>-`)を複数行にまたぐ形で書くと、行の折り返し位置に半角スペースが1つ挿入され、
# scripts/build-data.test.ts の S1 フィクスチャ一致テストが検出したとおり
# `src/core/scenario/fixtures/s1-targeted-email-intrusion.fixture.ts`(手書きの写し)と食い違う。
# 1行で書けば折り畳みが発生せず、フィクスチャとの文字列完全一致を保てる。

schema_version: "0.6.0"
id: s1-targeted-email-intrusion
title: 標的型メールからの侵入
status: reviewed
map_order: 1

subject_tags:
  - 攻撃手法
  - インシデント対応
  - 法制度
  - ネットワーク基盤

difficulty: 1
estimated_minutes: 12

# 出典表記(docs/citation-policy.md §5, #14)。特定の年度・問題からの引用ではなく
# テーマ知識のみを参考にしたオリジナル創作のため、material_kind + note のみとする
# (exam/year_jp/division/question は根拠のない値を捏造しない)。
references:
  - material_kind: 攻撃手口
    note: 標的型メール攻撃(マクロ付き文書によるマルウェア感染とC2通信)というテーマ知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。
  - material_kind: 技術要素
    note: インシデント初動対応における証拠保全の順序(揮発性の高い情報から保全する原則)というテーマ知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。

related_terms:
  - term-targeted-email-attack
  - term-edr
  - term-digital-forensics
  - term-incident-response-process
  - term-log-analysis
  - term-appi-breach-report

intro:
  background: 月末、経理部の中野が取引先を装った「請求書送付のご連絡」というメールを受け取り、添付のマクロ付きExcelファイルを開いた。その場では何も起きたように見えなかったが、1週間後、社内の端末から外部の見慣れないIPアドレスへ、深夜帯に一定間隔で通信が続いている痕跡がプロキシログに記録されているのが見つかり、対策室に緊急招集がかかる。
  victim_company:
    name: 株式会社浜通商事
    industry: 産業資材卸売業
    description: 取引先への請求書・発注書のやり取りが多い中堅の産業資材商社。経理部では日常的にメール添付のPDF・Excelファイルを開く業務フローが定着しており、添付ファイルの多さがかえって警戒心を鈍らせていた。
  character_intros:
    - character: 霧島
      line: 一定間隔の通信か。ビーコンの可能性が高い。まず感染の実態を洗おう。証拠を消すなよ。
    - character: 橘
      line: 報告義務の判断はこれからです。まずは事実確認と、被害範囲の特定を急ぎましょう。

investigation_points:
  - id: ip-proxy-log
    category: ログを見る
    label: プロキシログ
    description: 社内端末から外部への通信記録を確認する。
  - id: ip-edr-alert
    category: ログを見る
    label: EDRアラート
    description: 経理部端末で検知されたマクロ実行・不審プロセスの記録を確認する。
  - id: ip-sandbox-analysis
    category: ログを見る
    label: サンドボックスでの検体解析
    description: 回収した添付ファイルを隔離環境(サンドボックス)で実行し、挙動を確認する。
  - id: ip-mail-log
    category: ログを見る
    label: メールサーバのログ
    description: 問題のメールの送信元・添付ファイルの記録を確認する。
  - id: ip-witness-nakano
    category: 人に聞く
    label: 経理部 中野への聞き取り
    description: メールを開いた経緯を本人に確認する。
  - id: ip-witness-itstaff
    category: 人に聞く
    label: 情シス担当への聞き取り
    description: 発覚直後にとった対応と、今後の対策の選択肢を確認する。
  - id: ip-witness-manager
    category: 人に聞く
    label: 経理部長への聞き取り
    description: 部署内の状況とメール確認の運用について聞く。
  - id: ip-reference-advisory
    category: 文献を引く
    label: セキュリティ注意喚起情報の確認
    description: 直近の標的型メール攻撃に関する注意喚起を確認する。
  - id: ip-reference-guideline
    category: 文献を引く
    label: インシデント対応ガイドラインの確認
    description: マルウェア感染時の初動対応の手順を確認する。

# 探索の背景シーン(#52/#55/T037・docs/scenario_schema.md §2.5・Issue #57/T040)。
# investigation_points(カードの出所の正)は上記のまま維持し、ここは表示層(省略可)。
# 執務室(scene-office)・サーバ室(scene-server)の2シーンに分け、各 investigation_point を
# ちょうど1つの collect action から参照する(superRefine の整合性チェック要件)。
# 場所の割り振りは category と証言者・機器の性質に素直に従う:
# - 経理部端末のEDRアラート・中野/経理部長への聞き取り・文献確認は執務室。
# - プロキシログ・メールサーバログ・サンドボックス解析・情シス担当への聞き取りは
#   (通信記録/サーバ機器を扱う現場のため)サーバ室。
# PC(経理部 中野の端末)には danger アクション(電源を落とす)を1つ設け、
# カード群(card-reference-guideline・card-witness-itstaff-shutdown)にある
# 「電源を落とすと揮発性メモリの証拠が消える」という学びと整合させる(feedbackのみ・
# ペナルティ無し・操作継続可=詰み防止, spec §8.4)。
#
# 各collect actionのline/speaker(#52 Phase4.7/#65・T043で追加されたスキーマ、#66・T044で
# 本文執筆)は、カード本文の事実に忠実にキャラの口調で書いた(カードそのものの引用ではなく、
# 調査結果を語る一言に言い換えている)。話者はscene-explorer.tsxのresolveCollectPresentation
# が投げる既定(ログを見る→霧島／人に聞く・文献を引く→橘)と一致させつつ、技術寄りの内容には
# 明示speakerで振っている: ip-reference-advisory(攻撃手口の注意喚起)は文献系だが内容が
# 技術的なため霧島を明示。ip-witness-itstaffの台詞は証言カード(card-witness-itstaff-shutdown、
# is_dummy:true)を土台にしつつ、同じinvestigation_point_idに紐づく対策カード2枚
# (card-countermeasure-isolate/-shutdown、正誤の別)がどちらが正しいかは匂わせない
# (is_dummyはUIに一切出さない方針。旧pickTestimonyCard=非ダミー優先の経路は#66で廃止した
# =#62吸収。詳細はscene-explorer.tsxファイル冒頭コメント)。
# position(相対座標)は生成済み背景 assets/backgrounds/bg-s1-*.png を実際に目視して配置した
# (机上のノートPC・座っている社員・書棚・サーバラック・中央奥の運用端末に重なるよう調整。
# executive室に描かれた人物は1名のみのため、経理部長ホットスポットは特定の家具に重ねず、
# ドア/キャビネット側の余白に置いている)。
#
# 2026-09-11(#71・T045): bg-s1-server.pngがサーバ室中央奥の運用端末前に情シス担当の人物を
# 配した構図で再生成された(DESIGN.md「アセット」節P-4、PR #70)ため、情シス担当(person)の
# positionを旧[0.5, 0.8](床の上・人物と重ならない)から、実際に背景画像を計測して求めた
# 人物の頭部付近の座標[0.51, 0.43]へ更新した(1344x768pxの背景を目視・ピクセル計測。中野
# ホットスポット[0.47, 0.42]と同様、人物の顔付近を狙う既存の配置慣習に合わせた)。近接する
# 解析用端末(pc)ホットスポット[0.5, 0.55]とはy方向に約12%(≒92px)の間隔があり、ボタンの
# 当たり判定(48px)が重ならない。他のサーバ室ホットスポット(プロキシサーバ・メールサーバ・
# 解析用端末)は新背景でも位置が明らかにズレていなかったため変更していない。
#
# 2026-09-11(#52 Phase4.7 追補/#78・T046-ui-data): ドア設置と「サーバ管理者」統合。
# - ドア(object_type: door・goto)を執務室↔サーバ室の両シーンに追加した。背景の再生成はしない
#   (docs/scenario_schema.md §2.5・DESIGN.md「探索シーン」節)。執務室側は bg-s1-office.png
#   の右端に描かれている扉(壁際・窓付き木製扉)を実際に目視して座標を合わせた([0.95, 0.5])。
#   サーバ室側(bg-s1-server.png)には扉が描かれていない(ラック通路が手前へ続く構図)ため、
#   通路手前(出入口相当・カメラに最も近い位置)の座標に置いた([0.5, 0.9])。
# - 旧・解析用端末(pc・ip-sandbox-analysis)と旧・情シス担当(person・ip-witness-itstaff)は
#   「サーバ管理者」1ホットスポット(person・[0.51, 0.43]=旧情シス担当の位置を流用)に統合した。
#   旧pcホットスポット([0.5, 0.55])は削除し、重なりを解消した。各collectのline/speakerは
#   統合前の該当ホットスポットのものをそのまま引き継いでいる(本文執筆済みのため書き直さない)。
scenes:
  - id: scene-office
    title: 執務室
    background: bg-s1-office
    hotspots:
      - object_type: pc
        position: [0.4, 0.68]
        label: 経理部 中野の端末
        actions:
          - kind: collect
            investigation_point_id: ip-edr-alert
            label: EDRアラートを確認する
            line: 中野の端末でExcelのマクロ実行に続いて、見慣れないPowerShellプロセスが起動した記録がある。侵入の起点はここだろう。
            speaker: 霧島
          - kind: danger
            label: 感染端末の電源を落とす
            feedback: "橘「ここで電源を落とすと、動作中のプロセスや通信先の情報が乗った揮発性メモリの証拠が消えてしまいます。まずネットワークから論理的に隔離し、メモリ→ディスクの順で保全してください。」"
          - kind: noop
            label: 今は触らない
      - object_type: person
        position: [0.47, 0.42]
        label: 中野
        actions:
          - kind: collect
            investigation_point_id: ip-witness-nakano
            label: 中野に話を聞く
            line: 中野さんに話を聞きました。月末で請求書処理が立て込み、深く確認せずに開いてしまったと。マクロ有効化の警告が出たことにも、深く気を留めなかったそうです。
            speaker: 橘
      - object_type: person
        position: [0.87, 0.6]
        label: 経理部長
        actions:
          - kind: collect
            investigation_point_id: ip-witness-manager
            label: 経理部長に話を聞く
            line: 経理部長に伺いました。今月は取引先の請求サイクルが集中する時期で、多少雑な件名のメールでも本物だと思い込みやすい状況だったと。マクロ実行に関する社内規程の周知も、徹底されていなかったようです。
            speaker: 橘
      - object_type: book
        position: [0.6, 0.16]
        label: 資料棚
        actions:
          - kind: collect
            investigation_point_id: ip-reference-advisory
            label: セキュリティ注意喚起情報を確認する
            line: 業界団体の注意喚起を確認した。取引先を装った請求書メールにマクロ付きファイルを添付し、開封後にC2サーバへ接続させる手口が、直近全国で報告されている。今回の型と一致する。
            speaker: 霧島
          - kind: collect
            investigation_point_id: ip-reference-guideline
            label: インシデント対応ガイドラインを確認する
            line: インシデント対応ガイドラインを確認しました。感染が疑われる端末は、まずネットワークから論理的に隔離し、電源は落とさないこと。揮発性メモリに乗った証拠を失わないためです。
            speaker: 橘
      - object_type: door
        position: [0.95, 0.5]
        label: サーバ室への扉
        actions:
          - kind: goto
            scene_id: scene-server
            label: サーバ室へ移動する
  - id: scene-server
    title: サーバ室
    background: bg-s1-server
    hotspots:
      - object_type: device
        position: [0.18, 0.45]
        label: プロキシサーバ
        actions:
          - kind: collect
            investigation_point_id: ip-proxy-log
            label: プロキシログを確認する
            line: 深夜帯、中野のPCから見覚えのない海外IPアドレスへ、約30分間隔で通信が続いている。典型的なビーコン通信のパターンだ。
            speaker: 霧島
      - object_type: device
        position: [0.82, 0.45]
        label: メールサーバ
        actions:
          - kind: collect
            investigation_point_id: ip-mail-log
            label: メールサーバのログを確認する
            line: 問題のメールを確認した。取引先名を騙った件名で、送信元は正規ドメインによく似た別ドメインだ。手口としては典型的だが、手が込んでいる。
            speaker: 霧島
      - object_type: person
        position: [0.51, 0.43]
        label: サーバ管理者
        prompt: "サーバ管理者「どうしましたか？」"
        actions:
          - kind: collect
            investigation_point_id: ip-witness-itstaff
            label: 話を聞く
            line: 情シス担当に聞きました。発覚直後、反射的に経理部PCの電源ケーブルに手をかけたものの、判断がつかず抜くのをためらい、対策室の到着を待ったそうです。
            speaker: 橘
          - kind: collect
            investigation_point_id: ip-sandbox-analysis
            label: PCを確認する
            line: 回収した添付ファイルをサンドボックスで動かした。マクロが外部URLから追加のプログラムを取得し、プロキシログと同じ宛先へビーコン通信している。IoCとして他端末の調査にも使える。
            speaker: 霧島
          - kind: noop
            label: 何でもない
      - object_type: door
        position: [0.5, 0.9]
        label: 執務室への扉
        actions:
          - kind: goto
            scene_id: scene-office
            label: 執務室へ移動する

cards:
  - id: card-proxy-c2
    type: ログ
    source: プロキシサーバ
    investigation_point_id: ip-proxy-log
    body: 深夜帯、経理部 中野のPCから、聞き覚えのない海外IPアドレスへ約30分間隔で短い通信が繰り返し送信されている。典型的なビーコン通信のパターンに一致する。
    is_dummy: false

  - id: card-proxy-noise
    type: ログ
    source: プロキシサーバ
    investigation_point_id: ip-proxy-log
    body: 同じ時間帯に契約中のクラウドバックアップサービスへの定期アップロードも記録されているが、宛先は正規の契約先ドメインであることを確認済み。
    is_dummy: true

  - id: card-edr-macro
    type: ログ
    source: EDR(端末検知・対応)
    investigation_point_id: ip-edr-alert
    body: 中野のPCで、Excelファイルからのマクロ実行に続いて、見慣れないPowerShellプロセスが起動した記録をEDRが検知していた。
    is_dummy: false

  - id: card-edr-noise
    type: ログ
    source: EDR(端末検知・対応)
    investigation_point_id: ip-edr-alert
