# crypto-riddle S1「標的型メールからの侵入」(入門編)
#
# 位置づけ:
# - Issue #5 の受け入れ基準に基づく本番シナリオ第1弾(tasks.md T015)。
#   ゲートPプロトタイプ(「アルファテック社」)は流用せず、被害企業・関係者はすべて本シナリオ用に新規に起こした。
# - 入門編のため暗号(cipher_stages)を含めない(#5 代表回答: 初動対応中心)。
#   resolution.cipher_stages は空配列(src/core/model/scenario.ts の T015 変更で0件を許容)。
# - 実在の企業・人物・事案を特定できない類型に抽象化し、攻撃手法は学習目的に必要な粒度に留め、
#   再現手順書にはしていない(#5 受け入れ基準)。
# - src/core/model/scenario.ts (zod, schema_version 0.3.0) に準拠する。`npm run build:data` で検証できる。
# - 解決パート(resolution)は会話モード(#42/T030)の questions[] 形式。本ファイルは #44 で
#   旧 attack_identification/countermeasure/wrong_answer_follow_ups の内容を機械的に questions[]
#   へ移し替えた暫定版であり、本格的な演出・分量調整(バランス調整を含む)は #46 で行う。
#
# 注記: 本文フィールド(body/description/line 等)は意図的に1行で記述している。YAML の折り畳み
# ブロックスカラー(`>-`)を複数行にまたぐ形で書くと、行の折り返し位置に半角スペースが1つ挿入され、
# scripts/build-data.test.ts の S1 フィクスチャ一致テストが検出したとおり
# `src/core/scenario/fixtures/s1-targeted-email-intrusion.fixture.ts`(手書きの写し)と食い違う。
# 1行で書けば折り畳みが発生せず、フィクスチャとの文字列完全一致を保てる。

schema_version: "0.3.0"
id: s1-targeted-email-intrusion
title: 標的型メールからの侵入
status: reviewed
map_order: 1

subject_tags:
  - 攻撃手法
  - インシデント対応
  - 法制度
  - ネットワーク基盤

difficulty: 1
estimated_minutes: 12

# 出典表記(docs/citation-policy.md §5, #14)。特定の年度・問題からの引用ではなく
# テーマ知識のみを参考にしたオリジナル創作のため、material_kind + note のみとする
# (exam/year_jp/division/question は根拠のない値を捏造しない)。
references:
  - material_kind: 攻撃手口
    note: 標的型メール攻撃(マクロ付き文書によるマルウェア感染とC2通信)というテーマ知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。
  - material_kind: 技術要素
    note: インシデント初動対応における証拠保全の順序(揮発性の高い情報から保全する原則)というテーマ知識を参考にしたオリジナル創作。特定の年度・問題からの引用ではない。

