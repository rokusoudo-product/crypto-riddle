resolution:
  # 入門編のため暗号を含めない(#5 代表回答)。0件を許容する src/core/model/scenario.ts の
  # T015 変更により、ENTER_RESOLUTION は cipher ステージを飛ばし questions[0] へ直接進む。
  cipher_stages: []

  # 会話モード(#42/T030)の問い列(spec §8.5「攻撃の起点 → 初動対応」の2問構成)。誤答肢の reply は
  # いずれも探索で集めたカードの内容を具体的に裏付けとして引用し、プレイヤーがカードドロワーで
  # 検証できる形にしている(#46/T035 本執筆)。
  questions:
    - id: q-entry-point
      subject_tag: 攻撃手法
      speaker: 霧島
      prompt: この侵入、どこから入られたと見る？
      choices:
        - text: 取引先を装った請求書メールの添付ファイル(マクロ悪用によるマルウェア感染)
          is_correct: true
          reply: その通りだ、新人。フィッシングメールの実在、マクロ実行の記録、C2通信の痕跡――すべてが一直線に噛み合っている。
        - text: 公開サーバーの脆弱性を突かれた侵入
          is_correct: false
          reply: その場合は境界の通信記録に、外から内への不審なアクセスが残るはずだ。だがログにあるのは中野のPCから外部への定期通信だけ。外からの侵入痕跡はない。
        - text: ウイルス対策ソフトの定義ファイル更新エラーに乗じた侵入
          is_correct: false
          reply: そのエラーは半年前から続く既知の警告で、時期が合わない。EDRが捉えた不審な流れは、マクロ実行→PowerShell起動から始まっている。侵入口はそこだ。
      explanations:
        - character: 霧島
          expression: serious
          line: 「怪しく見える」ことと「今回の侵入を裏付ける証拠」は違う。侵入口・実行痕跡・通信の証拠・当事者の証言が噛み合うかを確かめろ。
        - character: 橘
          expression: serious
          line: 時系列で並べて。半年前の警告と今回は別件です。この整理は、後で「いつ・何が起きたか」を説明する報告の骨子そのものになります。曖昧なままだと報告書が書けません。
      consult_hint: フィッシングメールの実在・マクロ実行の記録・C2通信の痕跡・中野の証言を分野で整理して提示する。

    - id: q-initial-response
      subject_tag: インシデント対応
      speaker: 橘
      prompt: 感染が疑われる端末への初動対応は？
      choices:
        - text: ネットワークから論理的に隔離し(LANケーブル抜線・Wi-Fi無効化)、電源は落とさず揮発性メモリとディスクの証拠を保全する
          is_correct: true
          reply: それが正しい初動です、あなた。IoCを抽出して被害範囲の特定へ進みましょう。この保全が、後の報告と説明責任の裏付けになります。
        - text: 感染が疑われる端末の電源を直ちに落とし、被害の拡大を止める
          is_correct: false
          reply: 電源を切れば、証拠になり得る揮発性メモリの情報が失われます。先にネットワークから論理隔離し、メモリ→ディスクの順で保全を。でなければ「何が漏れたか」を説明できず、報告義務を果たせません。
      explanations:
        - character: 霧島
          expression: neutral
          line: 揮発性メモリには、動作中のプロセスや通信先が乗っている。電源を切れば消える。まず「何が消えるか」を考えろ。
        - character: 橘
          expression: serious
          line: 証拠保全の原則は「揮発性の高い情報から」。論理隔離→メモリ→ディスクという手順そのものが、後の報告・説明責任の裏付けになります。範囲を特定できて初めて、報告要否の判断ができるのです。
      consult_hint: インシデント対応ガイドラインの原則(揮発性の高い情報から保全する)と、電源を落とすリスクを整理して提示する。

  clear_explanation:
    - character: 霧島
      expression: neutral
      line: 侵入口は取引先を装った請求書メール。マクロ付きファイルの実行でマルウェアが仕込まれ、C2への定期通信が確立した。感染端末はまず論理隔離、電源を落とさず揮発性メモリを保全――これが鉄則だ。よくやった、新人。
    - character: 橘
      expression: serious
      line: 経理部長の証言どおり、社内規程の周知不足も一因です。今回は個人情報の漏えいが確認されたわけではありませんが、取引先の請求データを扱う部署である以上、影響範囲の確認と、個人情報保護法に基づく報告要否の判断を怠らないこと。証拠を保全したからこそ、その判断ができるのです。
    - character: 小鳥遊
      expression: smile
      line: お疲れ様でした〜、新人さん。冷たいお茶、淹れておきましたよ。……次の現場も、きっと大丈夫。

  legal_refs:
    - LAW-APPI-BREACH-REPORT
