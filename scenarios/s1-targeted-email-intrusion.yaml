intro:
  # ナレーション(background)は台本v2.2で廃止(完全会話劇化)。小鳥遊の緊急入電から始まる
  # 9行の会話に置き換えた(#103)。
  victim_company:
    name: 株式会社浜通商事
    industry: 産業資材卸売業
    description: 取引先への請求書・発注書のやり取りが多い中堅の産業資材商社。経理部では日常的にメール添付のPDF・Excelファイルを開く業務フローが定着しており、添付ファイルの多さがかえって警戒心を鈍らせていた。
  character_intros:
    - character: 小鳥遊
      expression: smile
      line: あらあら〜、新人さん、ちょうど良いところに。今、浜通(はまどおり)商事さんから緊急のお電話が入りまして……。はい、お茶どうぞ〜。
    - character: 小鳥遊
      expression: serious
      line: ……産業資材の卸売をされている会社さんなんですけど、経理部の端末が一台、どうも様子がおかしいと。一週間ほど前に届いた請求書のメールを開いてから、というお話でした。
    - character: 霧島
      expression: serious
      line: ……深夜帯に、その端末から外部の見慣れないIPへ、一定間隔で通信が続いている。ビーコンの可能性が高いな。
    - character: 小鳥遊
      expression: thinking
      line: びーこん、ですか？
    - character: 霧島
      expression: neutral
      line: 乗っ取った端末が、攻撃者のサーバへ「準備できました」と定期的に信号を送る通信だ。C2――指令サーバとの連絡線だと思っていい。開いた請求書メールが起点だろう。
    - character: 橘
      expression: serious
      line: 一週間放置されていたのが気がかりです。取引先の請求データを扱う部署なら、影響範囲によっては個人情報保護法の報告義務が絡みます。……新人。ここからは事実確認と、被害範囲の特定が先決です。
    - character: 橘
      expression: confident
      line: あなたが現場を見て、証拠を組み立ててください。私と霧島さんは、詰まったところをフォローします。答えは代わりに出しません。
    - character: 霧島
      expression: neutral
      line: ……証拠を消すなよ、新人。現場へ行くぞ。
    - character: 小鳥遊
      expression: smile
      line: わたしは対策室で待機して、資料や各所への連絡をまわしておきますね〜。いってらっしゃい、新人さん。

investigation_points:
  - id: ip-proxy-log
    category: ログを見る
    label: プロキシログ
    description: 社内端末から外部への通信記録を確認する。
  - id: ip-edr-alert
    category: ログを見る
    label: EDRアラート
    description: 経理部端末で検知されたマクロ実行・不審プロセスの記録を確認する。
  - id: ip-sandbox-analysis
    category: ログを見る
    label: サンドボックスでの検体解析
    description: 回収した添付ファイルを隔離環境(サンドボックス)で実行し、挙動を確認する。
  - id: ip-mail-log
    category: ログを見る
    label: メールサーバのログ
    description: 問題のメールの送信元・添付ファイルの記録を確認する。
  - id: ip-witness-nakano
    category: 人に聞く
    label: 経理部 中野への聞き取り
    description: メールを開いた経緯を本人に確認する。
  - id: ip-witness-itstaff
    category: 人に聞く
    label: 情シス担当への聞き取り
    description: 発覚直後にとった対応と、今後の対策の選択肢を確認する。
  - id: ip-witness-manager
    category: 人に聞く
    label: 経理部長への聞き取り
    description: 部署内の状況とメール確認の運用について聞く。
  - id: ip-reference-advisory
    category: 文献を引く
    label: セキュリティ注意喚起情報の確認
    description: 直近の標的型メール攻撃に関する注意喚起を確認する。
  - id: ip-reference-guideline
    category: 文献を引く
    label: インシデント対応ガイドラインの確認
    description: マルウェア感染時の初動対応の手順を確認する。

# 探索の背景シーン(#52/#55/T037・docs/scenario_schema.md §2.5・Issue #57/T040)。
# investigation_points(カードの出所の正)は上記のまま維持し、ここは表示層(省略可)。
# 執務室(scene-office)・サーバ室(scene-server)の2シーンに分け、各 investigation_point を
# ちょうど1つの collect action から参照する(superRefine の整合性チェック要件)。
# 場所の割り振りは category と証言者・機器の性質に素直に従う:
# - 経理部端末のEDRアラート・中野/経理部長への聞き取り・文献確認は執務室。
# - プロキシログ・メールサーバログ・サンドボックス解析・情シス担当への聞き取りは
#   (通信記録/サーバ機器を扱う現場のため)サーバ室。
# PC(経理部 中野の端末)には danger アクション(電源を落とす)を1つ設け、
# カード群(card-reference-guideline・card-witness-itstaff-shutdown)にある
# 「電源を落とすと揮発性メモリの証拠が消える」という学びと整合させる(feedbackのみ・
# ペナルティ無し・操作継続可=詰み防止, spec §8.4)。
#
# 2026-09-13(#103): 台本v2.2への移植で、各collect actionの本文は line/speaker(単発)から
# dialogue[](多ターン・NPC直接発話対応、schema 0.7.0/§2.6)へ全件差し替えた。話者の既定導出
# (ログを見る→霧島／人に聞く・文献を引く→橘、scene-explorer.tsxのdefaultSpeakerForCategory)は
# dialogueが明示されている場合は使われない(dialogue優先)。以下のline/speaker前提の記述は
# 差し替え前(0.6.0以前)の設計判断の記録として残す。
#
# 各collect actionのline/speaker(#52 Phase4.7/#65・T043で追加されたスキーマ、#66・T044で
# 本文執筆)は、カード本文の事実に忠実にキャラの口調で書いた(カードそのものの引用ではなく、
# 調査結果を語る一言に言い換えている)。話者はscene-explorer.tsxのresolveCollectPresentation
# が投げる既定(ログを見る→霧島／人に聞く・文献を引く→橘)と一致させつつ、技術寄りの内容には
# 明示speakerで振っている: ip-reference-advisory(攻撃手口の注意喚起)は文献系だが内容が
# 技術的なため霧島を明示。ip-witness-itstaffの台詞は証言カード(card-witness-itstaff-shutdown、
# is_dummy:true)を土台にしつつ、同じinvestigation_point_idに紐づく対策カード2枚
# (card-countermeasure-isolate/-shutdown、正誤の別)がどちらが正しいかは匂わせない
# (is_dummyはUIに一切出さない方針。旧pickTestimonyCard=非ダミー優先の経路は#66で廃止した
# =#62吸収。詳細はscene-explorer.tsxファイル冒頭コメント)。
# position(相対座標)は生成済み背景 assets/backgrounds/bg-s1-*.png を実際に目視して配置した
# (机上のノートPC・座っている社員・書棚・サーバラック・中央奥の運用端末に重なるよう調整。
# executive室に描かれた人物は1名のみのため、経理部長ホットスポットは特定の家具に重ねず、
# ドア/キャビネット側の余白に置いている)。
#
# 2026-09-11(#71・T045): bg-s1-server.pngがサーバ室中央奥の運用端末前に情シス担当の人物を
# 配した構図で再生成された(DESIGN.md「アセット」節P-4、PR #70)ため、情シス担当(person)の
# positionを旧[0.5, 0.8](床の上・人物と重ならない)から、実際に背景画像を計測して求めた
# 人物の頭部付近の座標[0.51, 0.43]へ更新した(1344x768pxの背景を目視・ピクセル計測。中野
# ホットスポット[0.47, 0.42]と同様、人物の顔付近を狙う既存の配置慣習に合わせた)。近接する
# 解析用端末(pc)ホットスポット[0.5, 0.55]とはy方向に約12%(≒92px)の間隔があり、ボタンの
# 当たり判定(48px)が重ならない。他のサーバ室ホットスポット(プロキシサーバ・メールサーバ・
# 解析用端末)は新背景でも位置が明らかにズレていなかったため変更していない。
#
# 2026-09-11(#52 Phase4.7 追補/#78・T046-ui-data): ドア設置と「サーバ管理者」統合。
# - ドア(object_type: door・goto)を執務室↔サーバ室の両シーンに追加した。背景の再生成はしない
#   (docs/scenario_schema.md §2.5・DESIGN.md「探索シーン」節)。執務室側は bg-s1-office.png
#   の右端に描かれている扉(壁際・窓付き木製扉)を実際に目視して座標を合わせた([0.95, 0.5])。
#   サーバ室側(bg-s1-server.png)には扉が描かれていない(ラック通路が手前へ続く構図)ため、
#   通路手前(出入口相当・カメラに最も近い位置)の座標に置いた([0.5, 0.9])。
# - 旧・解析用端末(pc・ip-sandbox-analysis)と旧・情シス担当(person・ip-witness-itstaff)は
#   「サーバ管理者」1ホットスポット(person・[0.51, 0.43]=旧情シス担当の位置を流用)に統合した。
#   旧pcホットスポット([0.5, 0.55])は削除し、重なりを解消した。各collectのline/speakerは
#   統合前の該当ホットスポットのものをそのまま引き継いでいる(本文執筆済みのため書き直さない)。
#
# 2026-09-11(#52 執務室背景B案再採用): bg-s1-office.pngを、中野・経理部長の2名を描いた
# 再生成B案(ノートPCの背面に画面を描かない版、DESIGN.md「アセット」節)に差し替えた。
# 旧背景は経理部長を画面右寄りに単独配置していたが、新背景は中野の机の左に経理部長が
# 寄り添って立つ構図に変わり、ドアも画面右端(旧[0.95, 0.5]はアートワーク領域の外=余白に
# はみ出ていた)からやや内側に描き直された。1344x768pxの背景をPython/PILでクロップして
# 目視・ピクセル計測し、以下のとおり座標を更新した:
# - pc(経理部 中野の端末): [0.4, 0.68] → [0.52, 0.57](机上のノートPC画面中央)
# - person(中野): [0.47, 0.42] → [0.53, 0.4](着席した中野の顔付近)
# - person(経理部長): [0.87, 0.6] → [0.39, 0.27](中野の左に立つ経理部長の顔付近)
# - door(サーバ室への扉): [0.95, 0.5] → [0.84, 0.54](扉が画面内に収まる位置へ)
# - book(資料棚): [0.6, 0.16] → [0.62, 0.2](天板際でなく書棚本体にかかるよう微調整)
# 各ホットスポットの当たり判定(48px)同士は重ならないことを座標間の距離で確認済み。
scenes:
  - id: scene-office
    title: 執務室
    background: bg-s1-office
    hotspots:
      - object_type: pc
        position: [0.52, 0.57]
        label: 経理部 中野の端末
        actions:
          - kind: collect
            investigation_point_id: ip-edr-alert
            label: EDRアラートを確認する
            dialogue:
              - character: 霧島
                expression: thinking
                line: 新人、このプロセス名――どう見る？
              - character: 霧島
                expression: serious
                line: Excelのマクロ実行に続いて、見慣れないPowerShellが起動した記録がある。正規の業務でこの並びは出ない。侵入の起点はここだ。
          - kind: danger
            label: 感染端末の電源を落とす
            feedback: "橘「待って、あなた。ここで電源を落とすと、動作中のプロセスや通信先が乗った揮発性メモリの証拠が消えます。まずネットワークから論理的に隔離し、メモリ→ディスクの順で保全を。」"
          - kind: noop
            label: 今は触らない
      - object_type: person
        position: [0.53, 0.4]
        label: 中野
        actions:
          - kind: collect
            investigation_point_id: ip-witness-nakano
            label: 中野に話を聞く
            dialogue:
              - npc: 中野
                line: すみません……月末で請求処理が立て込んでて。取引先からの「請求書送付のご連絡」ってメールで、疑いもせず添付を開いてしまって……。「マクロを有効にしますか」って出たのも、いつも通りだと思って押しちゃったんです。
              - character: 橘
                expression: neutral
                line: ……ご本人も認めています。件名の巧妙さと、月末の油断が重なった。よくある入口です。
      - object_type: person
        position: [0.39, 0.27]
        label: 経理部長
        actions:
          - kind: collect
            investigation_point_id: ip-witness-manager
            label: 経理部長に話を聞く
            dialogue:
              - npc: 経理部長 夏目
                line: 今月は取引先の請求サイクルが集中していてね。多少雑な件名でも、本物と思い込みやすい状況だった。……マクロ実行に関する社内規程も、正直、周知が徹底できていなかった。私の責任だ。
              - character: 橘
                expression: serious
                line: 規程はあっても、現場に届いていなければ機能しません。ここは後の再発防止と説明責任に効いてくる論点です。覚えておいて。
      - object_type: book
        position: [0.62, 0.2]
        label: 資料棚
        actions:
          - kind: collect
            investigation_point_id: ip-reference-advisory
            label: セキュリティ注意喚起情報を確認する
            dialogue:
              - character: 霧島
                expression: neutral
                line: 業界団体の注意喚起だ。取引先を装った請求書メールにマクロ付きファイルを添付し、開封後にC2サーバへ接続させる手口が、直近で全国的に報告されている。今回の型と一致する。
          - kind: collect
            investigation_point_id: ip-reference-guideline
            label: インシデント対応ガイドラインを確認する
            dialogue:
              - character: 橘
                expression: neutral
                line: インシデント対応ガイドライン。感染が疑われる端末は、まずネットワークから論理的に隔離し、電源は落とさないこと。揮発性メモリの証拠を失わないためです。
      - object_type: door
        position: [0.84, 0.54]
        label: サーバ室への扉
        actions:
          - kind: goto
            scene_id: scene-server
            label: サーバ室へ移動する
  - id: scene-server
    title: サーバ室
    background: bg-s1-server
    hotspots:
      - object_type: device
        position: [0.18, 0.45]
        label: プロキシサーバ
        actions:
          - kind: collect
            investigation_point_id: ip-proxy-log
            label: プロキシログを確認する
            dialogue:
              - character: 霧島
                expression: thinking
                line: 新人、この通信の“間隔”に注目しろ。何か気づかないか？
              - character: 霧島
                expression: serious
                line: 深夜帯、中野のPCから見覚えのない海外IPへ、約30分間隔できっちり通信が続いている。人間の操作ではありえない規則正しさ――典型的なビーコンだ。
      - object_type: device
        position: [0.82, 0.45]
        label: メールサーバ
        actions:
          - kind: collect
            investigation_point_id: ip-mail-log
