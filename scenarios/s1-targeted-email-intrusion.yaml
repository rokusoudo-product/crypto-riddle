# crypto-riddle S1「標的型メールからの侵入」(入門編)
#
# 位置づけ:
# - Issue #5 の受け入れ基準に基づく本番シナリオ第1弾(tasks.md T015)。
#   ゲートPプロトタイプ(「アルファテック社」)は流用せず、被害企業・関係者はすべて本シナリオ用に新規に起こした。
# - 入門編のため暗号(cipher_stages)を含めない(#5 代表回答: 初動対応中心)。
#   resolution.cipher_stages は空配列(src/core/model/scenario.ts の T015 変更で0件を許容)。
# - 実在の企業・人物・事案を特定できない類型に抽象化し、攻撃手法は学習目的に必要な粒度に留め、
#   再現手順書にはしていない(#5 受け入れ基準)。
# - src/core/model/scenario.ts (zod, schema_version 0.7.0) に準拠する。`npm run build:data` で検証できる。
# - 解決パート(resolution)は会話モード(#42/T030)の questions[] 形式(#44 で旧 attack_identification/
#   countermeasure/wrong_answer_follow_ups から機械移植。#46/T035 で誤答肢のセリフを本執筆し、
#   各誤答理由が具体的なカード(EDR検知の時系列・プロキシログの向き等)を裏付けに引用する形へ仕上げた)。
#
# 注記: 本文フィールド(body/description/line 等)は意図的に1行で記述している。YAML の折り畳み
# ブロックスカラー(`>-`)を複数行にまたぐ形で書くと、行の折り返し位置に半角スペースが1つ挿入され、
# scripts/build-data.test.ts の S1 フィクスチャ一致テストが検出したとおり
# `src/core/scenario/fixtures/s1-targeted-email-intrusion.fixture.ts`(手書きの写し)と食い違う。
# 1行で書けば折り畳みが発生せず、フィクスチャとの文字列完全一致を保てる。
#
# 2026-09-13(#103): 台本v2.2(代表確定・#100でスキーマ0.7.0仕様策定/#101・PR#105でzod実装完了)
# へ本文を移植した。intro.background(ナレーション)を廃止し character_intros を小鳥遊の
# 入電から始まる9行の会話劇に置き換え、scenes[].hotspots[].actions[].collect は全件 dialogue[]
# へ統一した(line/speakerは使わない)。中野・経理部長 夏目・サーバ管理者はNPC直接発話
# (npc+line)にし、続けて霧島/橘が要約・補足する2段構成にした。用語クッション(IoC)は
# 橘が質問役、霧島が回答役の3行構成。danger.feedbackは台本の橘台詞に更新。
# resolution.questions[].reply/explanations(話者付き2段=霧島→橘)・clear_explanation
# (霧島→橘→小鳥遊のねぎらいの3行)も台本の文言に更新した。choices[].text/consult_hintは
# 既存のまま維持した(台本と全角/半角括弧・略記に軽微な差異があるが、変更サマリに変更点として
# 挙がっておらず既存データを正とした。PR本文に記載)。cards[].body・investigation_points・
# ホットスポットの座標・object_type・カードの構造は変更していない。台本原本(Markdown)は
# 代表のDownloadsのみに保持し、本リポジトリにはコミットしない方針。

