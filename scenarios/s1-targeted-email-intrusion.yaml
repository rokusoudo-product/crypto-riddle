    type: 証言
    source: 経理部長
    investigation_point_id: ip-witness-manager
    body: 経理部長は「今月は取引先の請求サイクルが集中する時期で、多少雑な件名のメールでも本物だと思い込みやすい状況だった」と説明。添付ファイルのマクロ実行に関する社内規程の周知は徹底されていなかったという。
    is_dummy: true

  - id: card-reference-advisory
